name: Upstream Sync

# Create a git tag when rustfs/rustfs publishes a new version.
# Desktop installers use GitHub-hosted macOS/Windows runners and are not
# started by this workflow.
on:
  # Check upstream once a day at 02:00 UTC.
  schedule:
    - cron: '0 2 * * *'
  
  # Manual trigger.
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Prompt for a manual desktop build even when the version is unchanged'
        required: false
        type: boolean
        default: false

jobs:
  check-upstream:
    name: Check upstream version
    runs-on: sm-standard-2
    timeout-minutes: 15
    permissions:
      contents: write  # Required to create a tag
    outputs:
      has_new_version: ${{ steps.compare.outputs.has_new_version }}
      upstream_version: ${{ steps.upstream.outputs.version }}
      should_build: ${{ steps.compare.outputs.should_build }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install jq
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi
      
      - name: Fetch latest upstream version
        id: upstream
        run: |
          set -o pipefail
          
          # version.rustfs.com/latest.json is the official RustFS version feed.
          RAW_RESPONSE="$(curl -fsSL 'https://version.rustfs.com/latest.json')"
          UPSTREAM_VERSION="$(printf '%s' "$RAW_RESPONSE" | jq -r '.tag // .version // empty')"
          
          if [ -z "$UPSTREAM_VERSION" ] || [ "$UPSTREAM_VERSION" = "null" ]; then
            echo "Failed to extract an upstream version from the latest.json response"
            echo "$RAW_RESPONSE"
            exit 1
          fi
          
          echo "version=$UPSTREAM_VERSION" >> "$GITHUB_OUTPUT"
          echo "Latest upstream version: $UPSTREAM_VERSION"
      
      - name: Read current repository version
        id: current
        run: |
          # Current version comes from the newest git tag.
          CURRENT_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "Current version: $CURRENT_VERSION"
      
      - name: Compare versions
        id: compare
        run: |
          UPSTREAM="${{ steps.upstream.outputs.version }}"
          CURRENT="${{ steps.current.outputs.version }}"
          FORCE="${{ github.event.inputs.force_build }}"
          UPSTREAM_NORMALIZED="${UPSTREAM#v}"
          CURRENT_NORMALIZED="${CURRENT#v}"
          
          echo "Upstream version: $UPSTREAM"
          echo "Current version: $CURRENT"
          
          if [ "$FORCE" = "true" ]; then
            echo "Force-build mode"
            {
              echo "has_new_version=true"
              echo "should_build=true"
            } >> "$GITHUB_OUTPUT"
          elif [ "$UPSTREAM_NORMALIZED" != "$CURRENT_NORMALIZED" ]; then
            echo "New version found: $UPSTREAM (current: $CURRENT)"
            {
              echo "has_new_version=true"
              echo "should_build=true"
            } >> "$GITHUB_OUTPUT"
          else
            echo "Already on the latest version"
            {
              echo "has_new_version=false"
              echo "should_build=false"
            } >> "$GITHUB_OUTPUT"
          fi
      
      - name: Create version tag
        if: steps.compare.outputs.has_new_version == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM_VERSION="${{ steps.upstream.outputs.version }}"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if git rev-parse "$UPSTREAM_VERSION" >/dev/null 2>&1; then
            echo "Tag $UPSTREAM_VERSION already exists; skipping creation"
          else
            git tag -a "$UPSTREAM_VERSION" -m "Sync with upstream rustfs/rustfs $UPSTREAM_VERSION"
            git push origin "$UPSTREAM_VERSION"
            echo "Created and pushed tag: $UPSTREAM_VERSION"
          fi

  trigger-build:
    name: Remind to build desktop installers manually
    needs: check-upstream
    if: needs.check-upstream.outputs.should_build == 'true'
    runs-on: sm-standard-2
    timeout-minutes: 10
    
    steps:
      - name: Explain why the desktop build was not started
        run: |
          UPSTREAM_VERSION="${{ needs.check-upstream.outputs.upstream_version }}"

          echo "Recorded upstream version: $UPSTREAM_VERSION"
          echo "Desktop installers (macOS Apple Silicon, macOS Intel, and Windows) are not built automatically."
          echo "The org has no self-hosted macOS or Windows runners, and Tauri DMG/codesign and NSIS bundles cannot be cross-compiled on Linux."
          echo "Those jobs use GitHub-hosted runners and are billed only when Build and Release is run manually."
          echo "Manual publish example:"
          echo "  gh workflow run build.yml --ref $UPSTREAM_VERSION -f tag=$UPSTREAM_VERSION -f publish=true"
          echo "::warning title=Desktop build not started::Tag $UPSTREAM_VERSION is ready. Dispatch Build and Release manually; macOS/Windows jobs use billed GitHub-hosted runners."
      
      - name: Send notice
        if: always()
        run: |
          UPSTREAM_VERSION="${{ needs.check-upstream.outputs.upstream_version }}"
          echo "Version sync notice:"
          echo "  - Upstream version: $UPSTREAM_VERSION"
          echo "  - Job status: ${{ job.status }}"
          echo "  - Repository: ${{ github.repository }}"
          echo "  - Run ID: ${{ github.run_id }}"
          echo "  - Desktop installers: run Build and Release manually"
