name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    name: Check and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install WebAssembly target
        run: rustup target add wasm32-unknown-unknown

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Trunk
        run: cargo install trunk --version 0.21.14 --locked

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Check frontend Rust
        run: cargo check -p rustfs-launcher-ui --target wasm32-unknown-unknown

      - name: Run backend Clippy
        run: cargo clippy -p rustfs-launcher --all-targets --all-features -- -D warnings

      - name: Build frontend
        run: trunk build

      - name: Run tests
        run: |
          cargo test -p rustfs-launcher --all-features --locked
          cargo test -p rustfs-launcher-ui --locked
          bash scripts/select-rustfs-asset.sh --self-test
          bash scripts/test-package-macos-artifacts.sh

  test-native:
    name: Native tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run backend Clippy
        run: cargo clippy -p rustfs-launcher --all-targets --all-features -- -D warnings

      - name: Compile tests
        run: cargo test -p rustfs-launcher --all-features --locked --no-run

      - name: Run portable network tests
        shell: bash
        run: |
          test_binary="target/portable-network-tests"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            test_binary="${test_binary}.exe"
          fi
          rustc --edition=2021 --test src-tauri/src/network.rs -o "$test_binary"
          "$test_binary"

      - name: Run tests
        # The Tauri-linked lib test harness fails to start on Windows GHA with
        # STATUS_ENTRYPOINT_NOT_FOUND (WebView2/COM loader). Windows cfg code is
        # still compiled by clippy --all-targets and cargo test --no-run.
        if: runner.os != 'Windows'
        run: cargo test -p rustfs-launcher --all-features --locked
