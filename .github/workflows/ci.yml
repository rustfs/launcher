name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Native Windows/macOS tests are in ci-native.yml. They stay on GitHub-hosted
# runners and run only via workflow_dispatch: the org has no self-hosted
# macOS/Windows runners, and those tests execute on the target OS.

jobs:
  check:
    name: Check and Test
    runs-on: sm-standard-2
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install WebAssembly target
        run: rustup target add wasm32-unknown-unknown

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Trunk
        run: cargo install trunk --version 0.21.14 --locked

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Check frontend Rust
        run: cargo check -p rustfs-launcher-ui --target wasm32-unknown-unknown

      - name: Run backend Clippy
        run: cargo clippy -p rustfs-launcher --all-targets --all-features -- -D warnings

      - name: Build frontend
        run: trunk build

      - name: Run tests
        run: |
          cargo test -p rustfs-launcher --all-features --locked
          cargo test -p rustfs-launcher-ui --locked
          bash scripts/select-rustfs-asset.sh --self-test
          bash scripts/test-package-macos-artifacts.sh
