name: Build and Release

on:
  push:
    tags:
      - "*.*.*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., 0.1.0). If provided, will build in release mode."
        required: false
        type: string
      rustfs_tag:
        description: "RustFS release tag to bundle. Defaults to the latest upstream release."
        required: false
        type: string

jobs:
  # Build strategy check - determine build type and version
  build-check:
    name: Build Strategy Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      version: ${{ steps.check.outputs.version }}
      release_tag: ${{ steps.check.outputs.release_tag }}
      is_release: ${{ steps.check.outputs.is_release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine build strategy
        id: check
        run: |
          should_build=true
          version=""
          release_tag=""
          is_release=false

          if [[ "${{ github.event_name }}" == "release" ]]; then
            # Release event - get version from release tag
            release_tag="${{ github.event.release.tag_name }}"
            is_release=true
            echo "📦 Release build detected: $release_tag"
          elif [[ "${{ startsWith(github.ref, 'refs/tags/') }}" == "true" ]]; then
            # Tag push - get version from tag
            release_tag="${GITHUB_REF#refs/tags/}"
            is_release=true
            echo "🏷️ Tag build detected: $release_tag"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]] && [[ -n "${{ github.event.inputs.tag }}" ]]; then
            # Manual trigger with tag input - treat as release
            release_tag="${{ github.event.inputs.tag }}"
            is_release=true
            echo "🏷️ Manual release build detected: $release_tag"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]] && [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            # Manual trigger against a tag ref
            release_tag="${GITHUB_REF#refs/tags/}"
            is_release=true
            echo "🏷️ Manual tag-ref build detected: $release_tag"
          else
            # Manual trigger without tag or other
            version="dev-$(git rev-parse --short HEAD)"
            echo "🛠️ Development build detected: $version"
          fi

          if [[ "$is_release" == "true" ]]; then
            version="$release_tag"
          fi

          echo "should_build=$should_build" >> $GITHUB_OUTPUT
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "release_tag=$release_tag" >> $GITHUB_OUTPUT
          echo "is_release=$is_release" >> $GITHUB_OUTPUT

          echo "📊 Build Summary:"
          echo "  - Should build: $should_build"
          echo "  - Version: $version"
          echo "  - Is release: $is_release"

  build:
    name: Build
    needs: build-check
    if: needs.build-check.outputs.should_build == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            rust_target: "aarch64-apple-darwin"
            os_name: "macos"
            arch: "aarch64"

          - platform: "macos-15-intel"
            rust_target: "x86_64-apple-darwin"
            os_name: "macos"
            arch: "x86_64"

          - platform: "windows-latest"
            rust_target: "x86_64-pc-windows-msvc"
            os_name: "windows"
            arch: "x86_64"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install WebAssembly target
        run: rustup target add wasm32-unknown-unknown

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install trunk
          cargo install tauri-cli

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo install trunk --version 0.21.14 --locked
          cargo install tauri-cli

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Resolve upstream RustFS release
        id: upstream
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUSTFS_TAG: ${{ github.event.inputs.rustfs_tag }}
        run: |
          if [[ -n "$REQUESTED_RUSTFS_TAG" ]]; then
            tag="$REQUESTED_RUSTFS_TAG"
            echo "🎯 Using requested upstream release: $tag"
            gh release view "$tag" --repo rustfs/rustfs >/dev/null
          else
            tag=$(curl -fsSL https://version.rustfs.com/latest.json | jq -r '.tag // .version // empty')
            if [[ -z "$tag" || "$tag" == "null" ]]; then
              echo "❌ Failed to resolve latest upstream release from latest.json"
              exit 1
            fi
            echo "🎯 Using latest upstream release: $tag"
            gh release view "$tag" --repo rustfs/rustfs >/dev/null
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "RUSTFS_VERSION=${tag#v}" >> "$GITHUB_ENV"

      - name: Set launcher version
        if: needs.build-check.outputs.is_release == 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.build-check.outputs.version }}
        run: |
          version="${RELEASE_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "❌ Launcher version must be valid SemVer: $RELEASE_VERSION"
            exit 1
          fi

          jq --arg version "$version" '.version = $version' \
            src-tauri/tauri.conf.json > src-tauri/tauri.conf.json.tmp
          mv src-tauri/tauri.conf.json.tmp src-tauri/tauri.conf.json
          sed -i.bak -E "0,/^version = \"[^\"]+\"/s//version = \"$version\"/" src-tauri/Cargo.toml
          rm -f src-tauri/Cargo.toml.bak
          echo "LAUNCHER_VERSION=$version" >> "$GITHUB_ENV"

      - name: Disable updater artifacts for development builds
        if: needs.build-check.outputs.is_release != 'true'
        shell: bash
        run: |
          jq '.bundle.createUpdaterArtifacts = false' \
            src-tauri/tauri.conf.json > src-tauri/tauri.conf.json.tmp
          mv src-tauri/tauri.conf.json.tmp src-tauri/tauri.conf.json

      - name: Resolve RustFS asset for this platform
        id: rustfs_asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          case "${{ matrix.os_name }}-${{ matrix.arch }}" in
            macos-aarch64) slug="rustfs-macos-aarch64"; dest="src-tauri/binaries/rustfs-macos-aarch64" ;;
            macos-x86_64) slug="rustfs-macos-x86_64"; dest="src-tauri/binaries/rustfs-macos-x86_64" ;;
            windows-x86_64) slug="rustfs-windows-x86_64"; dest="src-tauri/binaries/rustfs-windows-x86_64.exe" ;;
            *)
              echo "❌ Unsupported launcher matrix: ${{ matrix.os_name }}-${{ matrix.arch }}"
              exit 1
              ;;
          esac

          asset_list=$(gh release view "$UPSTREAM_TAG" --repo rustfs/rustfs --json assets --jq '.assets[].name')
          selected=""
          if selected=$(bash scripts/select-rustfs-asset.sh "$slug" "$UPSTREAM_TAG" "$asset_list"); then
            true
          else
            selected=""
          fi

          if [[ -z "$selected" ]]; then
            echo "⚠️ No RustFS asset for $slug in $UPSTREAM_TAG"
            echo "available assets:"
            printf '%s\n' "$asset_list"
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "slug=$slug" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "✅ Using $selected"
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "asset=$selected" >> "$GITHUB_OUTPUT"
          echo "dest=$dest" >> "$GITHUB_OUTPUT"

      - name: Download RustFS binary (Unix)
        if: runner.os != 'Windows' && steps.rustfs_asset.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p src-tauri/binaries
          gh release download "${{ steps.upstream.outputs.tag }}" \
            --repo rustfs/rustfs \
            --pattern "${{ steps.rustfs_asset.outputs.asset }}" \
            --dir . \
            --clobber
          unzip -q "${{ steps.rustfs_asset.outputs.asset }}" -d rustfs-temp
          if [ -f rustfs-temp/rustfs ]; then
            cp rustfs-temp/rustfs "${{ steps.rustfs_asset.outputs.dest }}"
          else
            echo "❌ rustfs binary missing from ${{ steps.rustfs_asset.outputs.asset }}"
            ls -la rustfs-temp
            exit 1
          fi
          chmod +x "${{ steps.rustfs_asset.outputs.dest }}"
          rm -rf rustfs-temp "${{ steps.rustfs_asset.outputs.asset }}"

      - name: Download RustFS binary (Windows)
        if: runner.os == 'Windows' && steps.rustfs_asset.outputs.available == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $AssetName = "${{ steps.rustfs_asset.outputs.asset }}"
          $Dest = "${{ steps.rustfs_asset.outputs.dest }}"
          New-Item -ItemType Directory -Force -Path src-tauri\binaries | Out-Null
          gh release download "${{ steps.upstream.outputs.tag }}" --repo rustfs/rustfs --pattern $AssetName --dir . --clobber
          Expand-Archive -Path $AssetName -DestinationPath "rustfs-temp" -Force
          if (Test-Path "rustfs-temp\rustfs.exe") {
            Copy-Item "rustfs-temp\rustfs.exe" -Destination $Dest
          } elseif (Test-Path "rustfs-temp\rustfs") {
            Copy-Item "rustfs-temp\rustfs" -Destination $Dest
          } else {
            Write-Error "rustfs binary missing from $AssetName"
            Get-ChildItem rustfs-temp
            exit 1
          }
          Remove-Item -Recurse -Force rustfs-temp, $AssetName

      - name: Skip unsupported platform
        if: steps.rustfs_asset.outputs.available != 'true'
        run: |
          echo "Skipping ${{ matrix.os_name }}-${{ matrix.arch }} because upstream RustFS ${{ steps.upstream.outputs.tag }} has no matching binary."
          echo "The remaining Windows / Apple Silicon jobs can still publish a release."

      - name: Build Tauri application (macOS)
        if: runner.os == 'macOS' && steps.rustfs_asset.outputs.available == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build --target ${{ matrix.rust_target }} --bundles app,dmg

      - name: Build Tauri application (Windows)
        if: runner.os == 'Windows' && steps.rustfs_asset.outputs.available == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build --target ${{ matrix.rust_target }} --bundles nsis

      - name: Prepare and rename artifacts (macOS)
        if: runner.os == 'macOS' && steps.rustfs_asset.outputs.available == 'true'
        env:
          VERSION: ${{ needs.build-check.outputs.version }}
          IS_RELEASE: ${{ needs.build-check.outputs.is_release }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          mkdir -p artifacts

          # 允许空 glob 返回空数组，避免 zip 在找不到文件时直接失败
          shopt -s nullglob

          # Format: rustfs-launcher-{os}-{arch}-{version}
          ARTIFACT_PREFIX="rustfs-launcher-${{ matrix.os_name }}-${{ matrix.arch }}-${VERSION}"

          # 在 workspace 内搜索打包输出，不依赖固定路径
          APP_DIR=$(find src-tauri target -path "*bundle/macos/*.app" -type d -print -quit 2>/dev/null || true)
          UPDATER_FILE=$(find src-tauri target -path "*bundle/macos/*.app.tar.gz" -type f -print -quit 2>/dev/null || true)
          DMG_FILE=$(find src-tauri target -path "*bundle/dmg/*.dmg" -type f -print -quit 2>/dev/null || true)

          echo "发现的 .app 目录：${APP_DIR:-无}"
          echo "发现的 updater 文件：${UPDATER_FILE:-无}"
          echo "发现的 .dmg 文件：${DMG_FILE:-无}"
          find src-tauri target -path "*bundle/*" -print 2>/dev/null | head -80 || true

          # `--bundles app` used to skip updater archives. If Tauri did not emit
          # one, build it from the .app so latest.json can still be published.
          if [ -z "$UPDATER_FILE" ] && [ -n "$APP_DIR" ]; then
            APP_PARENT="$(dirname "$APP_DIR")"
            APP_NAME="$(basename "$APP_DIR")"
            UPDATER_FILE="${APP_PARENT}/${APP_NAME}.tar.gz"
            echo "ℹ️ Creating updater archive: $UPDATER_FILE"
            tar -C "$APP_PARENT" -czf "$UPDATER_FILE" "$APP_NAME"
            if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
              cargo tauri signer sign "$UPDATER_FILE"
            fi
          fi

          # Copy and rename DMG
          if [ -n "$DMG_FILE" ]; then
            cp "$DMG_FILE" "artifacts/${ARTIFACT_PREFIX}.dmg"
            echo "✅ Created: ${ARTIFACT_PREFIX}.dmg"
          fi

          # Create and rename app.zip
          if [ -n "$APP_DIR" ]; then
            codesign --force --deep --sign - "$APP_DIR"
            codesign --verify --deep --strict --verbose=4 "$APP_DIR"

            APP_PARENT="$(dirname "$APP_DIR")"
            APP_NAME="$(basename "$APP_DIR")"
            cd "$APP_PARENT"
            ditto -c -k --keepParent "$APP_NAME" "$GITHUB_WORKSPACE/artifacts/${ARTIFACT_PREFIX}.app.zip"
            echo "✅ Created: ${ARTIFACT_PREFIX}.app.zip"
          else
            echo "❌ 未找到 .app 产物"
            exit 1
          fi

          if [ "$IS_RELEASE" != "true" ]; then
            echo "ℹ️ Development build: updater artifact is disabled"
          elif [ -n "$UPDATER_FILE" ] && [ -f "${UPDATER_FILE}.sig" ]; then
            UPDATER_NAME="${ARTIFACT_PREFIX}.app.tar.gz"
            cp "$UPDATER_FILE" "artifacts/$UPDATER_NAME"
            cp "${UPDATER_FILE}.sig" "artifacts/${UPDATER_NAME}.sig"
            echo "✅ Created updater: $UPDATER_NAME"
          else
            echo "❌ 未找到 macOS updater 产物或签名"
            exit 1
          fi

          # Create latest version files, preserving compound suffixes such as .app.tar.gz.sig
          cd "$GITHUB_WORKSPACE/artifacts"
          LATEST_PREFIX="rustfs-launcher-${{ matrix.os_name }}-${{ matrix.arch }}-latest"
          VERSIONED_PREFIX="rustfs-launcher-${{ matrix.os_name }}-${{ matrix.arch }}-${VERSION}"
          for file in "${VERSIONED_PREFIX}"*; do
            if [ -f "$file" ]; then
              suffix="${file#"$VERSIONED_PREFIX"}"
              cp "$file" "${LATEST_PREFIX}${suffix}"
              echo "✅ Created latest: ${LATEST_PREFIX}${suffix}"
            fi
          done

          # 确保确实生成了产物
          if [ $(ls -1 | wc -l) -eq 0 ]; then
            echo "❌ 未生成任何 artifacts"
            exit 1
          fi

          ls -la "$GITHUB_WORKSPACE/artifacts"

      - name: Prepare and rename artifacts (Windows)
        if: runner.os == 'Windows' && steps.rustfs_asset.outputs.available == 'true'
        env:
          VERSION: ${{ needs.build-check.outputs.version }}
          IS_RELEASE: ${{ needs.build-check.outputs.is_release }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts

          # Format: rustfs-launcher-{os}-{arch}-{version}
          $ARTIFACT_PREFIX = "rustfs-launcher-${{ matrix.os_name }}-${{ matrix.arch }}-$env:VERSION"

          # 调试：列出可能的构建输出目录
          $targetPath = "target/${{ matrix.rust_target }}/release/bundle"
          if (-not (Test-Path $targetPath)) {
            $targetPath = "src-tauri/target/${{ matrix.rust_target }}/release/bundle"
          }
          Write-Host "🔍 搜索构建产物目录: $targetPath"
          if (Test-Path $targetPath) {
            Write-Host "📁 Bundle 目录存在，内容："
            Get-ChildItem -Path $targetPath -Recurse -File | Select-Object FullName, Length | Format-Table -AutoSize
          } else {
            Write-Host "❌ Bundle 目录不存在: $targetPath"
          }

          $artifactCount = 0

          # Copy and rename MSI
          # $msiPath = "$targetPath/msi"
          # Write-Host "🔍 搜索 MSI 文件: $msiPath"
          # $msiFiles = Get-ChildItem -Path $msiPath -Filter "*.msi" -ErrorAction SilentlyContinue
          # if ($msiFiles) {
          #   $destPath = "artifacts/$ARTIFACT_PREFIX.msi"
          #   Copy-Item $msiFiles[0].FullName -Destination $destPath
          #   Write-Host "✅ Created: $destPath"
          #   $artifactCount++
          # } else {
          #   Write-Host "⚠️ 未找到 MSI 文件在: $msiPath"
          # }

          # Copy and rename EXE (NSIS installer)
          $nsisPath = "$targetPath/nsis"
          Write-Host "🔍 搜索 NSIS EXE 文件: $nsisPath"
          $exeFiles = Get-ChildItem -Path $nsisPath -Filter "*.exe" -ErrorAction SilentlyContinue
          if ($exeFiles) {
            $destPath = "artifacts/$ARTIFACT_PREFIX-setup.exe"
            Copy-Item $exeFiles[0].FullName -Destination $destPath
            $signaturePath = "$($exeFiles[0].FullName).sig"
            if ($env:IS_RELEASE -eq "true" -and -not (Test-Path $signaturePath)) {
              Write-Error "未找到 Windows updater 签名: $signaturePath"
              exit 1
            }
            if (Test-Path $signaturePath) {
              Copy-Item $signaturePath -Destination "$destPath.sig"
            }
            Write-Host "✅ Created: $destPath"
            $artifactCount++
          } else {
            Write-Host "⚠️ 未找到 NSIS EXE 文件在: $nsisPath"
          }

          # 检查是否至少生成了一个产物
          if ($artifactCount -eq 0) {
            Write-Host "❌ 错误：未找到任何构建产物（MSI 或 EXE）"
            Write-Host "请检查构建是否成功完成"
            exit 1
          }

          # Create latest version files, including -setup.exe and .sig
          $LATEST_PREFIX = "rustfs-launcher-${{ matrix.os_name }}-${{ matrix.arch }}-latest"
          $VERSIONED_PREFIX = "rustfs-launcher-${{ matrix.os_name }}-${{ matrix.arch }}-$env:VERSION"
          Get-ChildItem -Path "artifacts" | Where-Object { $_.Name.StartsWith($VERSIONED_PREFIX) } | ForEach-Object {
            $suffix = $_.Name.Substring($VERSIONED_PREFIX.Length)
            Copy-Item $_.FullName -Destination "artifacts/$LATEST_PREFIX$suffix"
            Write-Host "✅ Created latest: $LATEST_PREFIX$suffix"

            if ($_.Name -like "*-setup.exe") {
              $plainName = "$LATEST_PREFIX.exe"
              Copy-Item $_.FullName -Destination "artifacts/$plainName"
              Write-Host "✅ Created latest: $plainName"
            }
          }

          # 只保留 NSIS EXE 文件，删除 MSI 文件
          Get-ChildItem -Path "artifacts" -Filter "*.msi" | Remove-Item -Force
          Write-Host "🗑️ 已删除 MSI 文件，只保留 EXE 安装包"

          Write-Host "📦 最终 artifacts 列表："
          Get-ChildItem -Path artifacts | Format-Table Name, Length -AutoSize

      - name: Upload artifacts
        if: steps.rustfs_asset.outputs.available == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: rustfs-launcher-${{ matrix.os_name }}-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error

      - name: Upload to Cloudflare R2
        if: needs.build-check.outputs.is_release == 'true' && steps.rustfs_asset.outputs.available == 'true'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        shell: bash
        run: |
          if [[ -z "$R2_ACCESS_KEY_ID" || -z "$R2_SECRET_ACCESS_KEY" || -z "$R2_ENDPOINT" || -z "$R2_BUCKET" ]]; then
            echo "⚠️ R2 credentials or endpoint missing, skipping artifact upload"
            exit 0
          fi

          if ! command -v aws >/dev/null 2>&1; then
            echo "ℹ️ aws CLI not found, installing AWS CLI v2..."
            case "$(uname -s)" in
              Linux)
                case "$(uname -m)" in
                  x86_64) AWS_CLI_ARCH="x86_64" ;;
                  aarch64|arm64) AWS_CLI_ARCH="aarch64" ;;
                  *) echo "❌ Unsupported architecture for aws CLI install: $(uname -m)"; exit 1 ;;
                esac
                curl -sL "https://awscli.amazonaws.com/awscli-exe-linux-${AWS_CLI_ARCH}.zip" -o awscliv2.zip
                unzip -q awscliv2.zip
                ./aws/install --update -i "${RUNNER_TEMP:-/tmp}/aws-cli" -b "${RUNNER_TEMP:-/tmp}/aws-bin"
                export PATH="${RUNNER_TEMP:-/tmp}/aws-bin:$PATH"
                rm -rf awscliv2.zip aws
                ;;
              Darwin)
                curl -sL "https://awscli.amazonaws.com/AWSCLIV2.pkg" -o AWSCLIV2.pkg
                sudo installer -pkg AWSCLIV2.pkg -target /
                rm -f AWSCLIV2.pkg
                ;;
              MINGW*|MSYS*|CYGWIN*)
                echo "❌ aws CLI is required on Windows runners but was not found"
                exit 1
                ;;
              *) echo "❌ Unsupported OS for aws CLI install: $(uname -s)"; exit 1 ;;
            esac
          fi

          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION="auto"
          # AWS CLI v2.23+ enables data integrity checksums by default, which
          # Cloudflare R2 does not fully support; only send them when required.
          export AWS_REQUEST_CHECKSUM_CALCULATION="when_required"
          export AWS_RESPONSE_CHECKSUM_VALIDATION="when_required"

          R2_PATH="s3://${R2_BUCKET}/artifacts/rustfs-launcher/release/"

          echo "📤 Uploading artifacts to $R2_PATH..."
          for file in artifacts/*; do
            if [[ -f "$file" ]]; then
              echo "Uploading: $file"
              aws s3 cp "$file" "$R2_PATH" --endpoint-url "$R2_ENDPOINT" --only-show-errors
              echo "✅ Uploaded: $(basename "$file")"
            fi
          done

          echo "✅ R2 upload completed successfully"

  # Upload release assets
  upload-release-assets:
    name: Upload Release Assets
    needs: [build-check, build]
    runs-on: ubuntu-latest
    if: needs.build-check.outputs.is_release == 'true'
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts
          pattern: rustfs-launcher-*
          merge-multiple: true

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets

          # Copy all artifacts
          if [ -d "artifacts" ] && [ "$(ls -A artifacts)" ]; then
            cp artifacts/* release-assets/
            echo "✅ Artifacts copied to release-assets"
          else
            echo "⚠️ No artifacts found to copy"
          fi

          # Generate checksums
          cd release-assets
          if ls *.dmg *.zip *.msi *.exe 2>/dev/null; then
            sha256sum * > SHA256SUMS
            echo "✅ SHA256SUMS generated"
          else
            echo "⚠️ No files found for checksum generation"
          fi

          echo "📦 Release assets:"
          ls -la

      - name: Generate updater manifest
        env:
          RELEASE_TAG: ${{ needs.build-check.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.build-check.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cd release-assets
          version="${RELEASE_VERSION#v}"
          base_url="https://github.com/${REPOSITORY}/releases/download/${RELEASE_TAG}"

          platforms="{}"
          add_platform() {
            local key="$1"
            local pattern="$2"
            local file
            file=$(find . -maxdepth 1 -name "$pattern" ! -name "*-latest*" -print -quit)
            if [ -z "$file" ] || [ ! -f "${file}.sig" ]; then
              echo "ℹ️ Optional updater platform missing: $key (${file:-no file})"
              return 0
            fi
            platforms=$(jq \
              --arg key "$key" \
              --arg url "$base_url/$(basename "$file")" \
              --arg sig "$(cat "${file}.sig")" \
              '. + {($key): {url: $url, signature: $sig}}' \
              <<<"$platforms")
            echo "✅ Added updater platform $key -> $(basename "$file")"
          }

          add_platform "darwin-aarch64" "rustfs-launcher-macos-aarch64-*.app.tar.gz"
          add_platform "darwin-x86_64" "rustfs-launcher-macos-x86_64-*.app.tar.gz"
          add_platform "windows-x86_64" "rustfs-launcher-windows-x86_64-*-setup.exe"

          if ! jq -e 'has("darwin-aarch64") and has("windows-x86_64")' <<<"$platforms" >/dev/null; then
            echo "❌ Release requires signed updater artifacts for Apple Silicon and Windows"
            echo "$platforms"
            exit 1
          fi

          jq -n \
            --arg version "$version" \
            --arg notes "RustFS Launcher ${version}，包含构建时选定的 RustFS 版本。" \
            --arg pub_date "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --argjson platforms "$platforms" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: $platforms
            }' > latest.json

          jq empty latest.json
          echo "📦 latest.json"
          jq . latest.json

      - name: Upload to GitHub Release
        if: needs.build-check.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.build-check.outputs.release_tag }}
          files: release-assets/*
          draft: false
          prerelease: ${{ contains(needs.build-check.outputs.release_tag, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
